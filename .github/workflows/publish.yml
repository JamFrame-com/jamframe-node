# Publishes the package to npm when a version tag (0.1.0, 1.2.3, …) is pushed.
#
# Publishing uses npm trusted publishing: npm trusts this workflow in this
# repository, so no npm token is stored anywhere, and every version gets a
# signed provenance statement. npm only lets you add a trusted publisher to a
# package that already exists, so the very first release used a token: set
# the NPM_TOKEN secret for that one run, then delete it.

name: Publish

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm exchange GitHub's OIDC token and sign the provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11.5.1 or later is needed for trusted publishing.
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - name: Publish
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
